<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Exam Page</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <button id="dark-mode">Dark Mode</button>
    <h1>Form Validation</h1>
    <form action="">
        <input class="inputs" type="text" id="name" placeholder="Enter your name">
        <input class="inputs" type="text" id="email" placeholder="Enter your email">
        <textarea class="inputs" name="message" id="message" placeholder="Enter your message"></textarea>
        <button class="submitbtn" type="submit" id="btn">submit</button>
    </form>
    <h2>Image Gallery</h2>
    <div class="gallery">
        <img src="images/food1.png" alt="error" id="mainImg">
        <div class="thumbs">
            <img src="images/food1.png" alt="error" class="thumb">
            <img src="images/food2.png" alt="error" class="thumb" id="food2">
            <img src="images/food3.png" alt="error" class="thumb">
            <img src="images/avatar.webp" alt="error" class="thumb">
        </div>
    </div>
    <script src="JS/main.js"></script>
</body>
</html>
